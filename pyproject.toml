[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arboviroses-norte-forecast"
version = "0.1.0"
description = "Pipeline de dados e previsão semanal de arboviroses na Região Norte"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "requests>=2.32",
  "scipy>=1.13",
]

[project.optional-dependencies]
train = ["torch>=2.6"]

[project.scripts]
arboviroses = "arboviroses.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
